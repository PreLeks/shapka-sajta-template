<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <title>Шапка сайта</title>
</head>

<body>

  <header class="header">
    <div class="container header__container">
      <a href="#" class="header__logo">DevPath</a>

      <nav class="nav">
        <ul class="nav__list">
          <li class="nav__item">
            <a href="#" class="nav__link">Главная</a>
          </li>
          <li class="nav__item">
            <a href="#" class="nav__link">Задания</a>
          </li>
          <li class="nav__item">
            <a href="#" class="nav__link">Статьи</a>
          </li>
          <li class="nav__item">
            <a href="#" class="nav__link">Прогресс</a>
          </li>
        </ul>
      </nav>

      <div class="header__btns">
        <button type="button" class="header__search" aria-label="Открыть поиск">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M21 21L16.66 16.66" stroke="#0F172A" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" />
            <path
              d="M11 19C15.4183 19 19 15.4183 19 11C19 6.58172 15.4183 3 11 3C6.58172 3 3 6.58172 3 11C3 15.4183 6.58172 19 11 19Z"

          </svg>

        <button type="button" class="header__start">Начать обучение</button>
      </div>
    </div>

</html>
